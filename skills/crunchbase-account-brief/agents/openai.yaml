interface:
  display_name: "Account Brief"
  short_description: "Prepare seller-specific Crunchbase meeting briefs"
  icon_small: "./assets/crunchbase-icon-blue.png"
  icon_large: "./assets/crunchbase-icon-blue.png"
  brand_color: "#146AFF"
  default_prompt: "Use $crunchbase-account-brief to prepare a seller-specific sales meeting brief for a named account."
dependencies:
  tools:
    - type: "mcp"
      value: "crunchbase"
      description: "Crunchbase account identity, profile, product and dated-event tools"
policy:
  allow_implicit_invocation: true
