  short_description: "Review Crunchbase signals across your account book"
  icon_small: "./assets/crunchbase-icon-blue.png"
  icon_large: "./assets/crunchbase-icon-blue.png"
  brand_color: "#146AFF"
  default_prompt: "Use $crunchbase-account-signals to review recent signals across my existing sales account book."
dependencies:
